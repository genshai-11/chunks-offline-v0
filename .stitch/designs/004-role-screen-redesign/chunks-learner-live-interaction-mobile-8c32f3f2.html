<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>CHUNKS | Learner Interact</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;family=Public+Sans:wght@400;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "tertiary-dim": "#006036",
                    "surface-container-low": "#f2f4f4",
                    "secondary-fixed": "#ffdea8",
                    "error": "#9e422c",
                    "primary": "#bd0d25",
                    "on-background": "#2d3435",
                    "on-primary-fixed-variant": "#b90722",
                    "on-secondary": "#fff8f1",
                    "on-surface-variant": "#596061",
                    "on-error-container": "#742410",
                    "surface-variant": "#dde4e5",
                    "on-primary-container": "#a7001d",
                    "surface-dim": "#d3dbdd",
                    "primary-dim": "#a9001d",
                    "outline": "#757c7d",
                    "secondary-fixed-dim": "#ffcd71",
                    "surface-container-high": "#e4e9ea",
                    "tertiary": "#006e3f",
                    "tertiary-container": "#6cf6a6",
                    "secondary-container": "#ffdea8",
                    "on-primary-fixed": "#850014",
                    "inverse-surface": "#0c0f0f",
                    "error-container": "#fe8b70",
                    "on-tertiary-fixed": "#004626",
                    "surface-container": "#ebeeef",
                    "on-tertiary-container": "#005b33",
                    "on-secondary-container": "#6c4c00",
                    "on-primary": "#fff6f5",
                    "background": "#f9f9f9",
                    "tertiary-fixed": "#6cf6a6",
                    "on-secondary-fixed": "#553b00",
                    "surface-tint": "#bd0d25",
                    "surface-container-lowest": "#ffffff",
                    "on-surface": "#2d3435",
                    "on-error": "#fff7f6",
                    "on-secondary-fixed-variant": "#785500",
                    "primary-fixed-dim": "#ffc7c3",
                    "tertiary-fixed-dim": "#5de899",
                    "inverse-on-surface": "#9c9d9d",
                    "outline-variant": "#acb3b4",
                    "primary-fixed": "#ffdad7",
                    "surface-container-highest": "#dde4e5",
                    "secondary": "#7d5900",
                    "secondary-dim": "#6e4d00",
                    "primary-container": "#ffdad7",
                    "surface": "#f9f9f9",
                    "inverse-primary": "#ff5355",
                    "on-tertiary-fixed-variant": "#00653a",
                    "error-dim": "#5c1202",
                    "on-tertiary": "#e7ffeb",
                    "surface-bright": "#f9f9f9"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "fontFamily": {
                    "headline": ["Inter"],
                    "display": ["Inter"],
                    "body": ["Inter"],
                    "label": ["Public Sans"]
            }
          },
        },
      }
    </script>
<style>
        body { -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-ring {
            box-shadow: 0 0 0 4px rgba(189, 13, 37, 0.2);
        }
        @keyframes pulse-soft {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        .animate-pulse-soft {
            animation: pulse-soft 3s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background font-body select-none overflow-hidden">
<!-- TopAppBar -->
<header class="flex justify-between items-center px-4 h-14 w-full bg-surface border-b border-outline-variant sticky top-0 z-50">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-primary" data-icon="school">school</span>
<span class="text-lg font-headline font-black text-primary tracking-tight">CHUNKS</span>
</div>
<div class="bg-surface-container-high px-3 py-1 rounded-full border border-outline-variant/30">
<span class="font-mono text-sm font-bold text-on-surface-variant tracking-wider">C04-921</span>
</div>
</header>
<!-- Main Canvas -->
<main class="h-[calc(100vh-120px)] w-full max-w-xl mx-auto px-4 py-4 flex flex-col gap-4">
<!-- Status Indicator -->
<div class="flex items-center justify-between bg-surface-container-low px-4 py-3 rounded-xl border border-outline-variant/20">
<div class="flex items-center gap-2">
<div class="w-2 h-2 rounded-full bg-primary animate-pulse-soft"></div>
<span class="font-label text-xs uppercase tracking-widest text-on-surface-variant font-bold">Session Active</span>
</div>
<div class="flex items-center gap-1">
<span class="text-sm font-bold text-on-surface">Round 12</span>
<span class="text-xs text-on-surface-variant">/ 20</span>
</div>
</div>
<!-- Interaction Grid -->
<div class="flex-grow grid grid-cols-2 gap-4 h-full pb-4">
<!-- Option RED -->
<button class="group relative flex flex-col items-center justify-center bg-white border-2 border-error/10 rounded-2xl transition-all duration-200 active:scale-95 hover:border-error/40 overflow-hidden" data-color="red" onclick="handleSelect(this)">
<div class="absolute inset-0 bg-error/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full bg-error/10 flex items-center justify-center mb-4 transition-transform group-active:scale-110">
<span class="material-symbols-outlined text-error text-4xl" data-icon="error">error</span>
</div>
<span class="font-label text-sm font-bold text-error tracking-wide uppercase">Red</span>
</button>
<!-- Option YELLOW -->
<button class="group relative flex flex-col items-center justify-center bg-white border-2 border-secondary/10 rounded-2xl transition-all duration-200 active:scale-95 hover:border-secondary/40 overflow-hidden" data-color="yellow" onclick="handleSelect(this)">
<div class="absolute inset-0 bg-secondary/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full bg-secondary/10 flex items-center justify-center mb-4 transition-transform group-active:scale-110">
<span class="material-symbols-outlined text-secondary text-4xl" data-icon="warning">warning</span>
</div>
<span class="font-label text-sm font-bold text-secondary tracking-wide uppercase">Yellow</span>
</button>
<!-- Option GREEN -->
<button class="group relative flex flex-col items-center justify-center bg-white border-2 border-tertiary/10 rounded-2xl transition-all duration-200 active:scale-95 hover:border-tertiary/40 overflow-hidden" data-color="green" onclick="handleSelect(this)">
<div class="absolute inset-0 bg-tertiary/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full bg-tertiary/10 flex items-center justify-center mb-4 transition-transform group-active:scale-110">
<span class="material-symbols-outlined text-tertiary text-4xl" data-icon="check_circle">check_circle</span>
</div>
<span class="font-label text-sm font-bold text-tertiary tracking-wide uppercase">Green</span>
</button>
<!-- Option PURPLE -->
<button class="group relative flex flex-col items-center justify-center bg-white border-2 border-primary/10 rounded-2xl transition-all duration-200 active:scale-95 hover:border-primary/40 overflow-hidden" data-color="purple" onclick="handleSelect(this)">
<div class="absolute inset-0 bg-primary/5 opacity-0 group-active:opacity-100 transition-opacity"></div>
<div class="w-16 h-16 rounded-full bg-primary/10 flex items-center justify-center mb-4 transition-transform group-active:scale-110">
<span class="material-symbols-outlined text-primary text-4xl" data-icon="rocket_launch">rocket_launch</span>
</div>
<span class="font-label text-sm font-bold text-primary tracking-wide uppercase">Purple</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center h-16 px-2 pb-safe bg-surface border-t border-outline-variant z-50">
<!-- Interact (Active) -->
<a class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-full px-4 py-1 transition-transform scale-95 active:scale-90" href="#">
<span class="material-symbols-outlined" data-icon="touch_app" style="font-variation-settings: 'FILL' 1;">touch_app</span>
<span class="font-label text-[10px] uppercase tracking-wider font-bold mt-0.5">Interact</span>
</a>
<!-- History (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="font-label text-[10px] uppercase tracking-wider font-medium mt-0.5">History</span>
</a>
<!-- Profile (Inactive) -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined" data-icon="account_circle">account_circle</span>
<span class="font-label text-[10px] uppercase tracking-wider font-medium mt-0.5">Profile</span>
</a>
</nav>
<script>
        function handleSelect(element) {
            // Visual feedback for tap
            const color = element.getAttribute('data-color');
            const colors = {
                red: 'border-error ring-4 ring-error/20',
                yellow: 'border-secondary ring-4 ring-secondary/20',
                green: 'border-tertiary ring-4 ring-tertiary/20',
                purple: 'border-primary ring-4 ring-primary/20'
            };

            // Reset others (optional for single selection)
            document.querySelectorAll('button[data-color]').forEach(btn => {
                btn.className = btn.className.replace(/border-(error|secondary|tertiary|primary)/g, 'border-$1/10');
                btn.classList.remove('ring-4', 'ring-error/20', 'ring-secondary/20', 'ring-tertiary/20', 'ring-primary/20');
            });

            // Apply active state
            element.classList.remove('border-' + color + '/10');
            element.classList.add(...colors[color].split(' '));

            // Haptic feedback (if supported)
            if (window.navigator.vibrate) {
                window.navigator.vibrate(20);
            }
        }
    </script>
</body></html>
